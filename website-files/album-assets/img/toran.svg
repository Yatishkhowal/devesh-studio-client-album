<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="72" viewBox="0 0 180 72">
  <!-- Marigold garland (toran). The tile repeats side by side across the page. -->
  <defs>
    <radialGradient id="y" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#FFE38F"/>
      <stop offset=".55" stop-color="#FFB703"/>
      <stop offset="1" stop-color="#F08C00"/>
    </radialGradient>
    <radialGradient id="o" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#FFB25E"/>
      <stop offset=".55" stop-color="#FB8500"/>
      <stop offset="1" stop-color="#D45500"/>
    </radialGradient>
    <g id="m">
      <circle r="8"/>
      <circle r="7" fill="none" stroke="#7A3300" stroke-opacity=".22" stroke-width="2.6" stroke-dasharray="1.5 1.8"/>
      <circle r="4.4" fill="none" stroke="#7A3300" stroke-opacity=".2" stroke-width="2" stroke-dasharray="1.3 1.5"/>
      <circle r="1.9" fill="#8A3B00" fill-opacity=".55"/>
    </g>
    <g id="leaf">
      <path d="M0 0C5 6 5 17 0 25C-5 17-5 6 0 0Z" fill="#2E9E5B"/>
      <path d="M0 2V22" stroke="#1B6E3B" stroke-width=".9"/>
    </g>
  </defs>

  <!-- mango leaves at both knots -->
  <use xlink:href="#leaf" transform="translate(0 5) rotate(24)"/>
  <use xlink:href="#leaf" transform="translate(0 5) rotate(-24)"/>
  <use xlink:href="#leaf" transform="translate(180 5) rotate(24)"/>
  <use xlink:href="#leaf" transform="translate(180 5) rotate(-24)"/>

  <!-- string -->
  <path d="M0 6Q90 62 180 6" fill="none" stroke="#3F8F4E" stroke-width="2"/>

  <!-- marigolds along the string -->
  <use xlink:href="#m" fill="url(#y)" transform="translate(10.8 12.3)"/>
  <use xlink:href="#m" fill="url(#o)" transform="translate(30.6 21.8)"/>
  <use xlink:href="#m" fill="url(#y)" transform="translate(50.4 28.6)"/>
  <use xlink:href="#m" fill="url(#o)" transform="translate(70.2 32.6)"/>
  <use xlink:href="#m" fill="url(#y)" transform="translate(90 34)"/>
  <use xlink:href="#m" fill="url(#o)" transform="translate(109.8 32.6)"/>
  <use xlink:href="#m" fill="url(#y)" transform="translate(129.6 28.6)"/>
  <use xlink:href="#m" fill="url(#o)" transform="translate(149.4 21.8)"/>
  <use xlink:href="#m" fill="url(#y)" transform="translate(169.2 12.3)"/>

  <!-- hanging drop in the middle -->
  <path d="M90 42V58" stroke="#3F8F4E" stroke-width="1.4"/>
  <use xlink:href="#m" fill="url(#o)" transform="translate(90 50) scale(.62)"/>
  <circle cx="90" cy="57.5" r="1.8" fill="#FFD166"/>
  <path d="M90 58c4.6 4.4 4.8 9.4 0 13c-4.8-3.6-4.6-8.6 0-13Z" fill="#FF4D8D"/>

  <!-- pink knots (half on each side, they join into one) -->
  <circle cx="0" cy="5" r="4.2" fill="#FF4D8D"/>
  <circle cx="180" cy="5" r="4.2" fill="#FF4D8D"/>
</svg>
